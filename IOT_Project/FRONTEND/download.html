<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tải lịch sử cảm biến</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <!-- Nav đồng nhất -->
  <nav class="bg-gray-800 text-white p-4 w-full">
    <div class="container mx-auto flex justify-between items-center">
      <div class="text-xl font-bold">Menu</div>
      <div>
        <a href="history.html" class="px-4 py-2 hover:bg-gray-700 rounded-md transition duration-300">Xem Lịch Sử</a>
        <a href="download.html" class="px-4 py-2 bg-gray-700 rounded-md transition duration-300">Tải Lịch Sử</a>
        <a href="data.html" class="px-4 py-2 hover:bg-gray-700 rounded-md transition duration-300">Realtime</a>
        <a href="machine-learning.html" class="px-4 py-2 hover:bg-gray-700 rounded-md transition duration-300">Machine Learning</a>
      </div>
    </div>
  </nav>

  <main class="flex-1 container mx-auto p-4 md:p-8">
    <div class="bg-white rounded-xl shadow-xl p-6 md:p-8">
      <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-2">Tải lịch sử cảm biến</h1>
      <p class="text-gray-600 mb-6">Chọn khoảng ngày để tải dữ liệu lịch sử về file CSV từ API backend.</p>

      <!-- Form chọn ngày -->
      <div class="p-4 bg-gray-50 rounded-lg border mb-4">
        <div class="flex flex-col sm:flex-row items-center gap-4">
          <div class="flex items-center gap-2">
            <label for="downloadStartDate" class="font-semibold text-gray-700">Ngày bắt đầu</label>
            <input type="date" id="downloadStartDate" class="p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
          </div>
          <div class="flex items-center gap-2">
            <label for="downloadEndDate" class="font-semibold text-gray-700">Ngày kết thúc</label>
            <input type="date" id="downloadEndDate" class="p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
          </div>
          <button id="downloadBtn"
                  class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded-md shadow transition duration-200">
            Tải CSV
          </button>
        </div>
        <p id="downloadError" class="mt-3 hidden text-sm text-red-600"></p>
      </div>
    </div>
  </main>

  <script>
    const downloadBtn = document.getElementById('downloadBtn');
    const startDateInput = document.getElementById('downloadStartDate');
    const endDateInput = document.getElementById('downloadEndDate');
    const downloadError = document.getElementById('downloadError');

    window.addEventListener('load', () => {
      const today = new Date().toISOString().split('T')[0];
      startDateInput.value = today;
      endDateInput.value = today;
    });

    downloadBtn.addEventListener('click', () => {
      const startDate = startDateInput.value;
      const endDate = endDateInput.value;

      if (!startDate || !endDate) {
        downloadError.textContent = "Vui lòng chọn cả ngày bắt đầu và ngày kết thúc.";
        downloadError.classList.remove('hidden');
        return;
      }
      if (new Date(startDate) > new Date(endDate)) {
        downloadError.textContent = "Ngày bắt đầu không được lớn hơn ngày kết thúc.";
        downloadError.classList.remove('hidden');
        return;
      }

      downloadError.classList.add('hidden');
      const url = `http://localhost:3000/api/download?startDate=${startDate}&endDate=${endDate}`;
      window.open(url, '_blank');
    });
  </script>
</body>
</html>
